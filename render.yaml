# Render Blueprint — one-click deploy of the Express backend.
# In Render: New → Blueprint → pick the RishabhDhillon/findit_ai repo → Apply.
# All build/start/health/env are pre-configured below; only the live URL
# still needs to be copied into public/index.html (see README>>Deployment).
services:
  - type: web
    name: findit-api
    runtime: node
    repo: https://github.com/RishabhDhillon/findit_ai
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: EMBEDDINGS_ENABLED
        value: "false"
      - key: DETECTION_ENABLED
        value: "false"
      - key: DB_FILE
        value: ./data/db.json
      - key: UPLOAD_DIR
        value: ./uploads
      - key: IMG_MAX_MB
        value: "5"
      - key: MONGO_URI
        value: ""